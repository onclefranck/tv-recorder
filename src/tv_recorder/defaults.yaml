sources:
  radio-canada.ca:
    display_name: ICI Radio-Canada Tele
    start_url: "https://ici.radio-canada.ca/tele/en-direct"
    stream_url_pattern: "\\.m3u8(\\?|$)"
    stream_request_urls:
      - "https://services.radio-canada.ca/media/validation/v2/?appCode=medianetlive&connectionType=hd&deviceType=ipad&idMedia=cbft&multibitrate=true&output=json&tech=hls&manifestVersion=2"
    stream_response_url_patterns:
      - "services\\.radio-canada\\.ca/media/validation/v2/"
    stream_response_json_keys:
      - "url"
    stream_url_reject_patterns:
      - "dai\\.google\\.com"
      - "originpath=/linear/hls"
    output_extension: "mp4"
    recording:
      video:
        height: 720
      audio:
        language: "fre"
        comment: "Français"
        reject_comments:
          - "audio_dv"
    comskip:
      min_segment_seconds: 15
      min_break_seconds: 105
      break_gap_tolerance_seconds: 2
      ini:
        min_commercial_size: 25
        min_commercialbreak: 105
        max_commercialbreak: 600
        delete_show_before_first_commercial: 0
        delete_show_after_last_commercial: 0
    steps: []
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36"
  tvaplus.ca:
